name: Publish Packages

on:
  push:
    branches: ["main"]
  release:
    types: ["published"]

env:
  BASE_VERSION: "0.0.1"
  CONFIGURATION: Release
  PACKAGE_PROJECT: src/Loom/Loom.csproj
  PACKAGE_OUTPUT: artifacts/packages
  FEEDZ_API_KEY: ${{ secrets.FEEDZ_API_KEY }}
  FEEDZ_SOURCE_URL: ${{ vars.FEEDZ_SOURCE_URL }}
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration "$CONFIGURATION"

      - name: Test
        run: dotnet test --no-build --configuration "$CONFIGURATION"

      - name: Pack preview package
        if: github.event_name == 'push'
        run: >
          dotnet pack "$PACKAGE_PROJECT"
          --no-build
          --configuration "$CONFIGURATION"
          --output "$PACKAGE_OUTPUT"
          /p:VersionPrefix="$BASE_VERSION"
          /p:VersionSuffix="Loom-preview.${{ github.run_number }}"

      - name: Pack release package
        if: github.event_name == 'release'
        run: >
          dotnet pack "$PACKAGE_PROJECT"
          --no-build
          --configuration "$CONFIGURATION"
          --output "$PACKAGE_OUTPUT"
          /p:VersionPrefix="$BASE_VERSION"

      - name: Push package to Feedz
        if: env.FEEDZ_API_KEY != '' && env.FEEDZ_SOURCE_URL != ''
        run: >
          dotnet nuget push "$PACKAGE_OUTPUT/*.nupkg"
          --api-key "$FEEDZ_API_KEY"
          --source "$FEEDZ_SOURCE_URL"
          --skip-duplicate

      - name: Push package to NuGet
        if: github.event_name == 'release' && env.NUGET_API_KEY != ''
        run: >
          dotnet nuget push "$PACKAGE_OUTPUT/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
